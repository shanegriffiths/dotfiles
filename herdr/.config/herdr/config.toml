# herdr configuration
# Symlinked from ~/.dotfiles/herdr/.config/herdr/config.toml via stow.
#
# Only non-default values live here. Everything else is an implicit default —
# run `herdr --default-config` to see the full annotated set, and
# `herdr config check` to validate this file.
#
# Apply changes with `prefix+shift+r` or `herdr server reload-config`.

# Past first run; don't show the notification setup prompt on startup.
onboarding = false

[theme]
# Dark mode: "terminal" draws from the host terminal's ANSI palette rather
# than shipping its own colours, so Herdr rides Ghostty's Mocha for free —
# same approach as tmux, yazi, eza, and fzf. See THEME.md.
#
# Light mode: the terminal theme's SURFACE tokens are hardcoded dark-first —
# surface_dim = ANSI "bright black", a dark slate #4b535d in GitHub Light HC,
# rendered as a dark bar behind the selected sidebar row (herdr 0.7.4
# src/ui/sidebar.rs:784-791; verified unchanged in 0.7.5). GitHub Light HC has no pale ANSI slot (it's a
# high-contrast palette: all 16 indices are dark), so NO single adaptive
# override can fix a surface for both modes. Until upstream derives surfaces
# from the reported background, light mode swaps the BASE to catppuccin-latte
# (neutral pale surfaces, close to the GitHub Light greys) while the custom
# resets below keep text and panel background on the real terminal palette.
# GOTCHA: picking any theme in herdr's IN-APP settings writes that choice
# back into this file and force-writes `auto_switch = false` alongside it
# (save_theme(), src/app/config_io.rs) — silently disabling the light/dark
# split below. If the dark selection bar comes back, check this flag first
# and avoid the in-app theme picker; theme changes belong in this file.
name = "terminal"
auto_switch = true
dark_name = "terminal"
light_name = "catppuccin-latte"

[theme.custom]
# Custom overrides apply on top of WHICHEVER base auto_switch picked — every
# value here must therefore work on both light and dark backgrounds
# (named-ANSI or "reset" only; a hex would break one of the two modes).
# The built-in "terminal" theme (herdr 0.7.4 src/app/state.rs Palette::terminal())
# maps most secondary-text tokens to ANSI "white" (index 7), but singles out
# `overlay1` for ANSI "bright white" (index 15) instead — the token used for
# the selected-workspace-number badge in the collapsed sidebar (fg=overlay1 on
# a "reset"/transparent bg, i.e. the terminal's real background) and for body
# text in the settings/help/onboarding/release-notes overlays. Ghostty's
# GitHub Light HC palette deliberately makes index 15 (#88929d) fainter than
# index 7 (#66707b) — matching GitHub's own "placeholder" grey — so on this
# palette overlay1 renders at 3.16:1 contrast on white (fails WCAG AA text),
# well below overlay0/subtext0/mauve's 5.04:1 (already ANSI 7 by default).
# Re-pointing overlay1 at the same ANSI index those tokens already use closes
# the gap: 5.04:1 in light mode, still an ample 6.80:1 in dark mode (down from
# 8.55:1 — no functional loss). Named ANSI colour, not hex, so it keeps
# tracking Ghostty's live palette in both appearances automatically.
overlay1 = "gray"

# Body text and panel background: pin to the terminal's real defaults in both
# modes ("reset" = the OSC 10/11 colours). Light mode gets #0e1116-on-white
# instead of latte's blue-tinted ink on off-white; dark mode is unchanged
# (the terminal base already used reset for both).
text = "reset"
panel_bg = "reset"

[keys]
# Matches the tmux prefix so there's one muscle memory across both.
# Press it twice (ctrl+a ctrl+a) to send a literal ctrl+a to the shell,
# which keeps readline's beginning-of-line working inside a pane.
prefix = "ctrl+a"

# tmux-style arrow navigation, all off the prefix so nothing is intercepted
# inside a pane. Tabs are horizontal (left/right); spaces are the vertical
# sidebar list (up/down). These replace the prefix+p / prefix+n tab defaults.
previous_tab = "prefix+left"        # tmux: prefix+p
next_tab = "prefix+right"           # tmux: prefix+n
previous_workspace = "prefix+up"    # space above in the sidebar (unbound by default)
next_workspace = "prefix+down"      # space below in the sidebar (unbound by default)

[[keys.command]]              # open in a split beside your work
key = "prefix+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer --plugin herdr-file-viewer"

[[keys.command]]              # …or in its own tab
key = "prefix+shift+f"
type = "shell"
command = "herdr plugin action invoke open-file-viewer-tab --plugin herdr-file-viewer"

[ui]
# Red accent, consistent with the rest of the stack. Named colours resolve
# through the terminal's ANSI palette, so this tracks light/dark automatically.
accent = "red"

# Order the agents panel by attention queue rather than grouping by space —
# the agent that needs input surfaces first.
agent_panel_sort = "priority"

# Ask for a workspace name before creating one (0.7.5+), instead of naming
# after the fact.
prompt_new_workspace_name = true

show_agent_labels_on_pane_borders = true
[ui.toast]
# Herdr ships with notifications off, which hides the thing that makes an agent
# multiplexer useful: knowing when a background agent finished or is blocked.
# "system" asks the macOS notification service directly, so agent state changes
# surface even when Ghostty isn't focused. Alternatives: "herdr" for in-app
# toasts, "terminal" to ask Ghostty to raise them, "off" to disable.
delivery = "system"
