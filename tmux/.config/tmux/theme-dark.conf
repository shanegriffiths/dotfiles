# Dark-mode overrides for tmux — sourced only when macOS appearance is Dark
# (see the appearance block at the bottom of tmux.conf). Re-applied on `prefix r`.

# GitHub-dark status surface. This MUST be set here, after TPM loads the
# catppuccin plugin (bottom of tmux.conf) — re-sourcing on `prefix r` does NOT
# re-resolve catppuccin's flavor, so if the plugin cold-loaded as latte (the
# appearance probe is racy at launch), status-style stays latte (#e6e9ef) and
# the bar renders light even in dark mode. Mirrors theme-light.conf, which
# sets status-style for the same reason.
set -g status-style "bg=#262626,fg=#cdd6f4"
set -g status-right "#[bg=#262626] "

# Overlay popups: catppuccin leaves these on its mocha base (#1e1e2e). Force the
# #262626 "black" surface so popups match Ghostty/nvim instead of the blue-ish base.
set -g popup-style "bg=#262626,fg=#cdd6f4"
set -g popup-border-style "fg=#45475a,bg=#262626"

# Message / command prompt (rename-window, confirm-before, vi command line).
# tmux 3.7 changed messages to OVERLAY the status line rather than replacing it,
# so a style without "fill" only paints its own text and the centred window list
# (status-justify absolute-centre) shows through underneath. The fill attribute
# clears the whole width — restoring the pre-3.7 "prompt owns the line" look.
# catppuccin sets these without fill, so re-set here (sourced after the plugin).
set -g message-style "fg=#94e2d5,bg=#262626,fill=#262626,align=centre"
set -g message-command-style "fg=#94e2d5,bg=#262626,fill=#262626,align=centre"

# Catppuccin window-list palette (mocha). The plugin sets @thm_* with `set -og`
# (only-if-unset), so a racy cold-start that loaded latte LOCKS the palette to
# latte for the life of the server — no reload can dislodge it, and the window
# pills render light-mode on the dark bar. Force-set (set -g) the mocha values the
# window formats use so dark mode is correct and `prefix r` actually fixes it.
set -g @thm_crust "#11111b"
set -g @thm_fg "#cdd6f4"
set -g @thm_overlay_2 "#9399b2"
set -g @thm_surface_0 "#313244"
set -g @thm_surface_1 "#45475a"
set -g @thm_overlay_0 "#6c7086"
set -g @thm_yellow "#f9e2af"
